# Docker Compose Configuration
version: '3.8'
services:
  app:
    image: your-image
    ports:
      - "8080:80"
    volumes:
      - .:/app
    environment:
      - ENV_VAR_NAME=value
    depends_on:
      - db
  db:
    image: postgres
    environment:
      - POSTGRES_DB=your_database
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
